name: 'GHBall'
description: 'Turn your GitHub contributions into a self‑playing DX‑Ball SVG animation.'

# --- MARKETPLACE BRANDING ---
branding:
  icon: 'target'
  color: 'green'

inputs:
  username:
    description: 'GitHub username'
    required: true
    default: ${{ github.repository_owner }}
  token:
    description: 'GitHub token'
    required: false
    default: ${{ github.token }}
  speed:
    description: 'Ball speed in pixels/second'
    required: false
    default: '400'
  max_miss:
    description: 'Max misses before forcing a guaranteed hit'
    required: false
    default: '3'
  theme:
    description: 'light, dark, or auto (auto adapts to system preference)'
    required: false
    default: 'auto'
  score:
    description: 'Show a live score counter'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - run: |
        node ${{ github.action_path }}/generator.js \
          --username ${{ inputs.username }} \
          --speed ${{ inputs.speed }} \
          --max-miss ${{ inputs.max_miss }} \
          --theme ${{ inputs.theme }} \
          ${{ inputs.score == 'true' && '--score' || '' }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash

    # Push the output directory to the GHBall branch
    - name: Push to GHBall branch
      uses: crazy-max/ghaction-github-pages@v3.1.0
      with:
        target_branch: GHBall
        build_dir: output
        commit_message: "chore: update GHBall animations [skip ci]"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
