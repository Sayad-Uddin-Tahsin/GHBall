name: 'GitBall'
description: 'Generate a GitBall SVG'
inputs:
  username:
    required: true
    default: ${{ github.repository_owner }}
  token:
    required: false
    default: ${{ github.token }}
  speed:
    required: false
    default: '400'
  max_miss:
    required: false
    default: '3'
  theme:
    required: false
    default: 'light'
  score:
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: |
        node ${{ github.action_path }}/index.js \
          --username ${{ inputs.username }} \
          --speed ${{ inputs.speed }} \
          --max-miss ${{ inputs.max_miss }} \
          --theme ${{ inputs.theme }} \
          ${{ inputs.score == 'true' && '--score' || '' }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      shell: bash